<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Iframe Loader</title>

<style>
body {
    margin: 0;
    font-family: Arial;
}

/* Popup style */
#popup {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: black;
    color: white;
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 9999;
}

/* Button */
#popup button {
    padding: 15px 25px;
    font-size: 18px;
    cursor: pointer;
}

/* iframe hidden initially */
#iframeContainer {
    display: none;
    width: 100%;
    height: 100vh;
}

iframe {
    width: 100%;
    height: 100%;
    border: none;
}
</style>
</head>

<body>

<!-- Popup -->
<div id="popup">
    <button id="continueBtn">Click to Continue</button>
</div>

<!-- iframe -->
<div id="iframeContainer">
    <iframe id="myFrame"></iframe>
</div>

<script>
function loadIframe() {
    document.getElementById("popup").style.display = "none";

    let container = document.getElementById("iframeContainer");
    let iframe = document.getElementById("myFrame");

    container.style.display = "block";

    // 👇 YAHI IMAGE WALA CONCEPT HAI (src dynamically set ho raha hai)
    iframe.src = "https://google.com"; // apni link daalo
}

// Click pe open
document.getElementById("continueBtn").addEventListener("click", loadIframe);

// Mouse move pe bhi open (optional)
document.addEventListener("mousemove", function once() {
    loadIframe();
    document.removeEventListener("mousemove", once);
});
</script>

</body>
</html>
