<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>EduLearn — Loading</title>
<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial,sans-serif;
    background:#f5f7fb;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    padding:20px;
}

.card{
    width:100%;
    max-width:360px;
    background:#fff;
    padding:35px 25px;
    border-radius:18px;
    box-shadow:0 10px 30px rgba(0,0,0,0.1);
    text-align:center;
}

.card h2{
    font-size:28px;
    margin-bottom:12px;
    color:#111827;
}

.card p{
    font-size:15px;
    color:#6b7280;
    line-height:1.5;
    margin-bottom:25px;
}

.btn{
    width:100%;
    padding:14px;
    border:none;
    border-radius:12px;
    background:#2563eb;
    color:#fff;
    font-size:16px;
    font-weight:600;
    cursor:pointer;
    transition:0.3s;
}

.btn:hover{
    opacity:0.9;
}

@media(max-width:480px){

    .card{
        padding:30px 20px;
        border-radius:14px;
    }

    .card h2{
        font-size:24px;
    }

    .card p{
        font-size:14px;
    }

    .btn{
        padding:13px;
        font-size:15px;
    }
}

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; font-family: system-ui, -apple-system, sans-serif; overflow: hidden; }

  /* Bot-wall / "checking your browser" screen */
  #gate {
    position: fixed; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    background: #0f172a; color: #e2e8f0;
    text-align: center; gap: 18px; z-index: 10; padding: 24px;
    /* allow scroll gesture to register even though page itself doesn't scroll */
    touch-action: pan-y;
  }
  .spinner {
    width: 42px; height: 42px; border-radius: 50%;
    border: 4px solid #334155; border-top-color: #38bdf8;
    animation: spin 0.9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  #gate h1 { font-size: 19px; font-weight: 600; }
  #gate p { color: #94a3b8; font-size: 14px; max-width: 300px; line-height: 1.5; }

  /* The iframe that holds the real content (URL never changes) */
  #frame {
    position: fixed; inset: 0;
    width: 100%; height: 100%;
    border: 0; display: none; z-index: 5;
  }

  /* Cookie consent popup */
  #cookie {
    position: fixed; left: 12px; right: 12px; bottom: 12px;
    background: #1e293b; color: #e2e8f0;
    padding: 16px; border-radius: 12px;
    box-shadow: 0 10px 30px rgba(0,0,0,.4);
    display: flex; flex-wrap: wrap; align-items: center; gap: 10px;
    z-index: 20; font-size: 14px;
  }
  #cookie span { flex: 1 1 100%; }
  #cookie button {
    flex: 1; padding: 11px 14px; border: 0; border-radius: 8px;
    font-size: 14px; font-weight: 600; cursor: pointer;
  }
  .accept { background: #38bdf8; color: #04263a; }
  .reject { background: transparent; color: #94a3b8; border: 1px solid #475569 !important; }
</style>

<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-2DMKRPGVF0"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'G-2DMKRPGVF0');
</script>

</head>
<body>

  <!-- Bot wall: stays until a touch / scroll gesture is detected -->
  <div id="gate">
<div class="card">
    <h2>Click to Continue</h2>

    <p>
        Secure verification completed successfully.
    </p>

    <button class="btn">
        Continue
    </button>
</div>
  </div>

  <!-- Real content loads here. The address bar keeps showing this same page. -->
  <iframe id="frame" title="content"></iframe>

  <!-- Cookie consent -->
  <div id="cookie">
    <span>We use cookies to verify visitors and improve your experience.</span>
    <button class="accept" id="accept">Accept</button>
    <button class="reject" id="reject">Reject</button>
  </div>

<script>
(function () {
  var CONTENT_URL = "content.html"; // <- your real protected page
  var revealed = false;

  var gate   = document.getElementById("gate");
  var frame  = document.getElementById("frame");
  var cookie = document.getElementById("cookie");

  function setCookie(name, val) {
    document.cookie = name + "=" + val + "; path=/; max-age=" + (60 * 60 * 24 * 30) + "; SameSite=Lax";
  }
  function getCookie(name) {
    return document.cookie.split("; ").some(function (c) { return c.indexOf(name + "=") === 0; });
  }

  // Reveal the real content (loaded in an iframe so the URL never changes)
  function reveal() {
    if (revealed) return;
    revealed = true;
    frame.src = CONTENT_URL;
    frame.style.display = "block";
    gate.style.display = "none";
    cookie.style.display = "none"; 
  }

  // ---- Human-interaction (bot) check for mobile: touch OR scroll anywhere ----
  function onHuman() {
    setCookie("human", "1");
    cleanup();
    reveal();
  }
  function cleanup() {
    window.removeEventListener("touchstart", onHuman);
    window.removeEventListener("touchmove", onHuman);
    window.removeEventListener("scroll", onHuman);
    window.removeEventListener("wheel", onHuman);
    window.removeEventListener("mousemove", onHuman);
  }
  window.addEventListener("touchstart", onHuman, { once: true, passive: true });
  window.addEventListener("touchmove",  onHuman, { once: true, passive: true });
  window.addEventListener("scroll",     onHuman, { once: true, passive: true });
  window.addEventListener("wheel",      onHuman, { once: true, passive: true });
  window.addEventListener("mousemove",  onHuman, { once: true }); // desktop fallback

  // ---- Cookie consent (independent of reveal) ----
  document.getElementById("accept").addEventListener("click", function () {
    setCookie("cookie_consent", "accepted"); cookie.style.display = "none";
  });
  document.getElementById("reject").addEventListener("click", function () {
    setCookie("cookie_consent", "rejected"); cookie.style.display = "none";
  });

  if (getCookie("cookie_consent")) cookie.style.display = "none";
  if (getCookie("human")) reveal(); // returning visitor
})();
</script>
</body>
</html>
